[project]
name = "halter"
version = "0.1.3"
description = "Audits a change to a Python tree (its tests, changed-line coverage, lint, dead code, public deletions, a red-phase proof and a mutation run) and exits 0 accept, 1 refuse, 2 could not audit, 3 nothing to audit."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Eliza Halpern" }, { name = "Eryn Lipkowitz" }]
dependencies = [
    "coverage>=7.0",
    "pydantic>=2.13.5",
    # Runtime, not dev: `audit.gate_surface()` reads their installed versions
    # into the verdict cache key, and the gates shell out to both by name.
    "mutmut>=3.0,<4",
    "ruff>=0.8",
]

[project.scripts]
halter = "halter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halter"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "EM", "PT", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist",
                 "node_modules", "venv", "{arch}", "mutants"]
